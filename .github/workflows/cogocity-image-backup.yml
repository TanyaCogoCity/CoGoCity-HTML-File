
name: Weekly CoGo City Image Backup

on:
  schedule:
    - cron: '0 10 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup-images:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.DO_SPACES_BACKUP_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DO_SPACES_BACKUP_SECRET }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      ENDPOINT: https://sfo3.digitaloceanspaces.com

    steps:
      - name: Check AWS CLI
        run: aws --version

      - name: Download images to temporary storage
        run: |
          set -euo pipefail
          mkdir -p /tmp/cogocity-images
          aws s3 sync \
            s3://cogocity-images/ \
            /tmp/cogocity-images/ \
            --endpoint-url "$ENDPOINT" \
            --no-progress \
            --only-show-errors

      - name: Upload images to private backup
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          aws s3 sync \
            /tmp/cogocity-images/ \
            "s3://cogocity-private-backups/weekly-images/$DATE/" \
            --endpoint-url "$ENDPOINT" \
            --no-progress \
            --only-show-errors

      - name: Verify backup object count
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)

          SOURCE_COUNT=$(find /tmp/cogocity-images -type f | wc -l)

          BACKUP_COUNT=$(aws s3 ls \
            "s3://cogocity-private-backups/weekly-images/$DATE/" \
            --recursive \
            --endpoint-url "$ENDPOINT" \
            | wc -l)

          echo "Source files: $SOURCE_COUNT"
          echo "Backup files: $BACKUP_COUNT"

          test "$SOURCE_COUNT" -gt 0
          test "$SOURCE_COUNT" -eq "$BACKUP_COUNT"

          echo "Backup verification passed."
